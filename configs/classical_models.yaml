model_configs:
  random_forest_baseline:
    model: random_forest
    params:
      n_estimators: 200
      random_state: 42
  random_forest_regularized:
    model: random_forest
    params:
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 3
      max_features: sqrt
  extra_trees_baseline:
    model: extra_trees
    params:
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 2
      max_features: 1.0
  hist_gradient_boosting_baseline:
    model: hist_gradient_boosting
    params:
      random_state: 42
      learning_rate: 0.05
      max_iter: 300
      max_leaf_nodes: 15
      min_samples_leaf: 10
      l2_regularization: 1.0
  pca_feature_fusion_extra_trees:
    model: pca_feature_fusion
    params:
      image_size: 128
      resize_mode: letterbox
      n_components: 24
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 2
      max_features: 1.0
  fusion_pca24_letterbox_leaf1:
    model: pca_feature_fusion
    params:
      image_size: 128
      resize_mode: letterbox
      n_components: 24
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 1
      max_features: 1.0
  fusion_pca24_stretch_leaf2:
    model: pca_feature_fusion
    params:
      image_size: 128
      resize_mode: stretch
      n_components: 24
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 2
      max_features: 1.0
  fusion_original_stretch_log:
    model: pca_feature_fusion
    params:
      image_size: 128
      resize_mode: stretch
      n_components: 24
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 2
      max_features: 1.0
      target_transform: log
  tuned_96_pca24:
    model: pca_feature_fusion
    params:
      image_size: 96
      resize_mode: stretch
      n_components: 24
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 2
      max_features: 1.0
      target_transform: log
  dual_pca24_canonical16:
    model: pca_feature_fusion
    params:
      image_size: 128
      resize_mode: stretch
      canonical_resize_mode: letterbox
      n_components: 24
      canonical_components: 16
      n_estimators: 500
      random_state: 42
      min_samples_leaf: 2
      max_features: 1.0
      target_transform: log

feature_columns:
  - area
  - perimeter
  - solidity
  - circularity
  - equivalent_diameter
  - bbox_width
  - bbox_height
  - bbox_area
  - aspect_ratio
  - extent
  - convex_area
  - convexity
  - major_axis_length
  - minor_axis_length
  - hu_moment_1
  - hu_moment_2

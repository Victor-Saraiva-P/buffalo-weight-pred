model_configs:
  cnn_mask_only_geometry_channels:
    model: cnn_mask
    params: &training_recipe
      architecture: resnet18
      pretrained: true
      fine_tune_mode: last_block
      epochs: 120
      batch_size: 8
      learning_rate: 0.0001
      image_size: 224
      resize_mode: stretch
      random_state: 42
      weight_decay: 0.0001
      patience: 20
      validation_fraction: 0.2
      augment: true
      input_representation: geometry_channels
  cnn_mask_pure_geometry_fusion:
    model: cnn_mask_geometry
    params:
      <<: *training_recipe
